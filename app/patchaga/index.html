<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="description" content="Patchaga. Patch the bugs before the bugs patch you.">
<meta property="og:title" content="Patchaga">
<meta property="og:description" content="Patch the bugs before the bugs patch you.">
<meta property="og:image" content="/patchaga/static/share.png">
<title>Patchaga</title>
<link rel="icon" type="image/png" href="/patchaga/static/favicon.png">
<link rel="stylesheet" href="/patchaga/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>Patchaga</h1>
  <span class="tagline">Patch the bugs before the bugs patch you.</span>
  <span class="spacer"></span>
  <a href="/patchaga/board">Leaderboard</a>
</header>

<main class="stage">
  <canvas id="game" width="432" height="560" aria-label="Patchaga game"></canvas>
</main>

<footer class="hud">
  <ul class="legend" aria-label="What you are shooting at">
    <li title="Bottom rows. Dives straight and often."><i style="background:#8fd0ff"></i>DRONE</li>
    <li title="Middle rows. Swings wider and shoots more."><i style="background:#c08bff"></i>WEEVIL</li>
    <li title="Top row. Opens a beam and forks your duck."><i style="background:#ff6b4a"></i>ROOTKIT</li>
    <li class="hint">Shoot a rootkit mid-dive to get your duck back and fire double</li>
  </ul>
  <div class="controls">
    <label for="player">Player</label>
    <input id="player" autocomplete="off" autocapitalize="words"
           spellcheck="false" placeholder="Your name" maxlength="60">
    <button id="post" type="button">Post run</button>
    <span id="status" class="status"></span>
  </div>
</footer>

<script type="module" src="/patchaga/static/game.mjs"></script>
<noscript>
  <p style="padding:16px;color:#e94560">Patchaga needs JavaScript.</p>
</noscript>
</body>
</html>
