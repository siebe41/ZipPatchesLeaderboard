
# -------------------------------------------------------------------------- #
# No-build deploy: the container runs a stock python:3.11-slim image and
# mounts the app code + brand assets from ./app. Dependencies are installed
# on container start. This means a deploy is just:
#     1. Upload changed files into ./app  (File Station — no SSH needed)
#     2. Restart the container in the Synology Docker / Container Manager app
# No image rebuild is ever required, because nothing is baked in via Dockerfile.
# (The Dockerfile is kept only for the optional "build elsewhere + import" path.)
# -------------------------------------------------------------------------- #

services:
  leaderboard-api:
    image: python:3.11-slim
    container_name: leaderboard-app
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # App code + brand assets (main.py, requirements.txt, *.ico, *.png).
      # Edit/upload files here and just restart the container to deploy.
      - ./app:/app
      # Persistent state: leaderboard.json, history.json, and the zipscores
      # buffer DB (ZS_BUFFER_DB) all live under /home.
      - ./data:/home
    command: ["python", "/app/start.py"]
    # --- Zipscores collector / finalizer config (defaults shown) ---
    # environment:
    #   ZS_TIMEZONE: "America/Chicago"            # local TZ for "yesterday" + scheduler
    #   ZS_BUFFER_DB: "/home/zipscores_buffer.db" # under ./data:/home so it persists
    #   ZS_COLLECTOR_TOKEN: ""                    # if set, /collect requires X-Token header
    #   ZS_RETENTION_DAYS: "30"                   # prune buffered messages older than this
    #   ZS_FINALIZE_HOUR: "2"                     # daily finalize run hour (local time)
    #   ZS_FINALIZE_MINUTE: "10"                  # daily finalize run minute (local time)
    restart: unless-stopped
